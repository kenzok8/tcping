name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Linux (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
      - name: build
        run: make CC=${{ matrix.compiler }}

  build-cross-arm:
    name: Cross-compile (arm-linux-gnueabihf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cross toolchain
        run: sudo apt-get install -y gcc-arm-linux-gnueabihf
      - name: build
        run: make CC=arm-linux-gnueabihf-gcc STRIP=arm-linux-gnueabihf-strip

  # NOTE: mipsel cross-compile job removed 2026-11-21: Ubuntu 26.04
  # (ubuntu-latest) dropped gcc-mipsel-linux-gnu (Debian 13 dropped the
  # mipsel port). mipsel coverage continues via the OpenWrt SDK builds.
